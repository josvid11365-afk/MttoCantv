name: CI – MttoCantv

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:

  # ── 1. Verificar sintaxis ──────────────────────────────────────────────────
  lint:
    name: Verificar código Python
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verificar sintaxis
        run: |
          python3 -m py_compile mttocantv/app.py
          echo "✅ Sintaxis OK"

  # ── 2. Construir .deb para Linux Lite ─────────────────────────────────────
  build-linux:
    name: Construir .deb (Linux Lite)
    runs-on: ubuntu-22.04
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Instalar herramientas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            dpkg-dev \
            python3-tk \
            python3-pil \
            python3-pil.imagetk \
            python3-reportlab

      - name: Construir paquete .deb
        run: |
          set -e
          PKG="mttocantv_1.0.0_all"

          mkdir -p ${PKG}/DEBIAN
          mkdir -p ${PKG}/usr/bin
          mkdir -p ${PKG}/usr/lib/python3/dist-packages/mttocantv
          mkdir -p ${PKG}/usr/share/applications
          mkdir -p ${PKG}/usr/share/icons/hicolor/scalable/apps
          mkdir -p ${PKG}/usr/share/icons/hicolor/256x256/apps
          mkdir -p ${PKG}/usr/share/mttocantv
          mkdir -p ${PKG}/usr/share/doc/mttocantv

          cp mttocantv/app.py       ${PKG}/usr/lib/python3/dist-packages/mttocantv/
          cp mttocantv/__init__.py  ${PKG}/usr/lib/python3/dist-packages/mttocantv/

          if [ -f assets/banner.png ]; then
            cp assets/banner.png ${PKG}/usr/share/mttocantv/banner.png
          fi
          if [ -f assets/icon.png ]; then
            cp assets/icon.png   ${PKG}/usr/share/mttocantv/icon.png
            cp assets/icon.png   ${PKG}/usr/share/icons/hicolor/256x256/apps/mttocantv.png
          fi

          cat > ${PKG}/usr/bin/mttocantv <<'SCRIPT'
          #!/usr/bin/env python3
          # -*- coding: utf-8 -*-
          import sys
          sys.path.insert(0, '/usr/lib/python3/dist-packages')
          from mttocantv.app import main
          main()
          SCRIPT
          chmod +x ${PKG}/usr/bin/mttocantv

          cat > ${PKG}/usr/share/icons/hicolor/scalable/apps/mttocantv.svg <<'SVG'
          <?xml version="1.0" encoding="UTF-8"?>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
            <rect width="64" height="64" rx="10" fill="#1A237E"/>
            <text x="32" y="44" text-anchor="middle" font-size="34" fill="white">⚙</text>
          </svg>
          SVG

          cp debian/control           ${PKG}/DEBIAN/control
          cp debian/postinst          ${PKG}/DEBIAN/postinst
          chmod 755                   ${PKG}/DEBIAN/postinst
          cp debian/mttocantv.desktop ${PKG}/usr/share/applications/

          echo "MttoCantv v1.0 – MIT" > ${PKG}/usr/share/doc/mttocantv/copyright

          dpkg-deb --build --root-owner-group ${PKG}
          echo "✅ .deb generado:"
          ls -lh ${PKG}.deb

      - name: Verificar .deb
        run: dpkg-deb --info mttocantv_1.0.0_all.deb

      - name: Subir artefacto Linux
        uses: actions/upload-artifact@v4
        with:
          name: mttocantv-linux-deb
          path: mttocantv_1.0.0_all.deb
          retention-days: 60

  # ── 3. Construir .exe portable para Windows ───────────────────────────────
  build-windows:
    name: Construir .exe portable (Windows 7+)
    runs-on: windows-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias Python
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install pillow
          pip install reportlab

      - name: Construir .exe con PyInstaller
        shell: pwsh
        run: |
          pyinstaller `
            --onefile `
            --windowed `
            --name MttoCantv `
            --hidden-import tkinter `
            --hidden-import tkinter.ttk `
            --hidden-import sqlite3 `
            --hidden-import PIL `
            --hidden-import reportlab `
            mttocantv/app.py

          Write-Host "✅ .exe generado:"
          Get-Item dist\MttoCantv.exe

      - name: Crear carpeta portable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path MttoCantv_Portable | Out-Null
          Copy-Item dist\MttoCantv.exe MttoCantv_Portable\MttoCantv.exe

          if (Test-Path assets\banner.png) { Copy-Item assets\banner.png MttoCantv_Portable\banner.png }
          if (Test-Path assets\icon.png)   { Copy-Item assets\icon.png   MttoCantv_Portable\icon.png   }

          $readme = "MttoCantv - Registro de Mantenimiento`r`n"
          $readme += "Gerencia General de Energia y Climatizacion Guarico`r`n`r`n"
          $readme += "USO:`r`n"
          $readme += "  1. Doble clic en MttoCantv.exe`r`n"
          $readme += "  2. No requiere instalacion`r`n`r`n"
          $readme += "IMAGENES:`r`n"
          $readme += "  Coloca banner.png e icon.png en esta misma carpeta`r`n`r`n"
          $readme += "BASE DE DATOS:`r`n"
          $readme += "  Se guarda en: $env:APPDATA\mttocantv\registros.db`r`n"
          $readme += "  Usa Guardar BD / Cargar BD para mover datos entre equipos`r`n"
          $readme | Out-File -FilePath MttoCantv_Portable\LEEME.txt -Encoding utf8

          Get-ChildItem MttoCantv_Portable
          Write-Host "✅ Carpeta portable lista"

      - name: Comprimir carpeta portable
        shell: pwsh
        run: |
          Compress-Archive -Path MttoCantv_Portable -DestinationPath MttoCantv_Windows_Portable.zip -Force
          Write-Host "✅ ZIP portable creado"

      - name: Subir artefacto Windows
        uses: actions/upload-artifact@v4
        with:
          name: mttocantv-windows-portable
          path: MttoCantv_Windows_Portable.zip
          retention-days: 60

  # ── 4. Release en tag v* ──────────────────────────────────────────────────
  release:
    name: Publicar Release
    runs-on: ubuntu-22.04
    needs: [ build-linux, build-windows ]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Descargar artefacto Linux
        uses: actions/download-artifact@v4
        with:
          name: mttocantv-linux-deb

      - name: Descargar artefacto Windows
        uses: actions/download-artifact@v4
        with:
          name: mttocantv-windows-portable

      - name: Crear Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mttocantv_1.0.0_all.deb
            MttoCantv_Windows_Portable.zip
          body: |
            ## MttoCantv ${{ github.ref_name }}
            **Gerencia General de Energía & Climatización Guárico**

            ### Linux Lite / Ubuntu / Debian
            ```bash
            sudo dpkg -i mttocantv_1.0.0_all.deb
            sudo apt-get install -f
            ```

            ### Windows 7 / 10 / 11 (Portable)
            1. Descargar MttoCantv_Windows_Portable.zip
            2. Descomprimir en cualquier carpeta
            3. Doble clic en MttoCantv.exe — sin instalar nada

            ### Compartir BD entre equipos
            Usar los botones Guardar BD / Cargar BD dentro de la app
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
